<dialog #dialog aria-labelledby="credentials-title" (cancel)="onCancel($event)" (close)="onClose()">
  <form #form="ngForm" (ngSubmit)="submit(form.valid)">
    <h2 id="credentials-title">Изменить логин и пароль</h2>
    <div class="form-grid">
      <label class="wide">
        Новый логин
        <input name="username" autocomplete="username" required [(ngModel)]="username" autofocus />
      </label>
      <label class="wide">
        Новый пароль
        <input
          name="password"
          type="password"
          autocomplete="new-password"
          required
          [(ngModel)]="password"
        />
      </label>
    </div>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <div class="dialog-actions">
      <button type="button" class="secondary" [disabled]="pending()" (click)="close()">
        Отмена
      </button>
      <button
        type="submit"
        class="primary"
        [disabled]="pending() || !form.valid || !username.trim()"
      >
        {{ pending() ? 'Сохранение…' : 'Сохранить' }}
      </button>
    </div>
  </form>
</dialog>
