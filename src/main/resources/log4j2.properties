name = PropertiesConfig
property.log_dir = logs
# Log to console
appender.console.type = Console
appender.console.name = LogToConsole
appender.console.layout.type = PatternLayout
appender.console.layout.charset=UTF-8
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%-6p] [%5T] [%-20c{1}.%-20M]: %msg%n
# Log to files in logs folder
appender.rolling.type = RollingFile
appender.rolling.name = LogToRollingFile
appender.rolling.fileName = ${log_dir}/application.log
appender.rolling.filePattern = ${log_dir}/application.%d{yyyy-MM-dd}-%i.log.zip
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{HH:mm:ss.SSS} [%-6p] [%5T] [%-20c{1}.%-20M]: %msg%n
appender.rolling.layout.charset=UTF-8
appender.rolling.policies.type = Policies
# Change logging file every day
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
#size
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 1GB
# Delete logs older than 30 days
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 50
appender.rolling.strategy.action.type = Delete
appender.rolling.strategy.action.basePath = ${log_dir}
appender.rolling.strategy.action.maxDepth = 1
appender.rolling.strategy.action.condition.type = IfLastModified
appender.rolling.strategy.action.condition.age = 500D
# Configure both loggers
rootLogger.name = Main
rootLogger.level = INFO
rootLogger.additivity = false
rootLogger.appenderRef.rolling.ref = LogToRollingFile
rootLogger.appenderRef.console.ref = LogToConsole
