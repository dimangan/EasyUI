<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейросеть обучается...</title>
    <style>
        :root {
            --bg: #0a0e17;
            --accent: #6ee7ff;
            --accent2: #b78cff;
            --text: #e6ecf5;
            --dim: #8b96ab;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas#net {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 48px 56px;
            background: rgba(15, 20, 32, 0.65);
            border: 1px solid rgba(110, 231, 255, 0.25);
            border-radius: 18px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 60px rgba(110, 231, 255, 0.08);
            max-width: 560px;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            border: 1px solid rgba(110, 231, 255, 0.4);
            border-radius: 999px;
            padding: 4px 12px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        p {
            color: var(--dim);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 30%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            animation: load 2.4s ease-in-out infinite;
        }
        @keyframes load {
            0%   { width: 10%; margin-left: 0%; }
            50%  { width: 60%; margin-left: 20%; }
            100% { width: 10%; margin-left: 100%; }
        }

        .status {
            margin-top: 18px;
            font-size: 0.8rem;
            color: var(--dim);
            letter-spacing: 1px;
        }
        .status span {
            color: var(--accent);
        }

        footer {
            position: fixed;
            bottom: 16px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: var(--dim);
            z-index: 1;
        }
    </style>
</head>
<body>

<canvas id="net"></canvas>

<div class="card">
    <div class="badge">Model status: training</div>
    <h1>Нейросеть думает над этим сайтом</h1>
    <p>
        Сервер уже настроен, но контент пока обучается на собственных ошибках.
        Заходите чуть позже — веса вот-вот сойдутся.
    </p>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="status">Эпоха <span id="epoch">1</span> / loss: <span id="loss">0.842</span></div>
</div>

<footer>powered by nginx &amp; синтетический интеллект</footer>

<script>
    // счётчик эпох и лосса для атмосферы
    let epoch = 1;
    let loss = 0.842;
    setInterval(() => {
        epoch += 1;
        loss = Math.max(0.012, loss * (0.85 + Math.random() * 0.1));
        document.getElementById('epoch').textContent = epoch;
        document.getElementById('loss').textContent = loss.toFixed(3);
    }, 1800);

    // фон: нейронная сеть из узлов и связей
    const canvas = document.getElementById('net');
    const ctx = canvas.getContext('2d');
    let w, h, nodes;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const NODE_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 18000);
    nodes = Array.from({ length: NODE_COUNT }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 1.5 + 1
    }));

    function step() {
        ctx.clearRect(0, 0, w, h);

        for (const n of nodes) {
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < 0 || n.x > w) n.vx *= -1;
            if (n.y < 0 || n.y > h) n.vy *= -1;
        }

        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const a = nodes[i], b = nodes[j];
                const dx = a.x - b.x, dy = a.y - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 140) {
                    ctx.strokeStyle = `rgba(110, 231, 255, ${0.12 * (1 - dist / 140)})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                }
            }
        }

        for (const n of nodes) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(183, 140, 255, 0.6)';
            ctx.fill();
        }

        requestAnimationFrame(step);
    }
    step();
</script>

</body>
</html>
